name: living-crayon

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: living-crayon-main
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Mark main verification pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"living-crayon","description":"Verifying CRAYON main release boundary"}'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate local workspace manifests before install
        run: node scripts/check-workspace-manifests.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify semantic runtime, npm packages, and Lab
        run: npm run verify
      - name: Install Chromium for accessibility and visual proof
        run: npx playwright install --with-deps chromium
      - name: Verify CRAYON Lab accessibility semantics
        run: npm run accessibility:lab
      - name: Capture real CRAYON Lab screenshots
        env:
          CRAYON_RELEASE_SHA: ${{ github.sha }}
        run: npm run capture:lab
      - name: Capture cross-domain semantic visual matrix
        env:
          CRAYON_RELEASE_SHA: ${{ github.sha }}
        run: npm run capture:matrix
      - name: Verify visual matrix semantics, layout, and approved baseline
        run: npm run verify:visual-matrix
      - name: Upload CRAYON Lab visual proof
        uses: actions/upload-artifact@v4
        with:
          name: crayon-lab-ui-${{ github.run_number }}
          path: |
            artifacts/ui/*.png
            artifacts/ui-matrix/*.png
            artifacts/ui-matrix/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified screenshots into repository docs
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/images
          cp artifacts/ui/crayon-lab-banking-desktop-dark.png docs/images/crayon-lab-banking-desktop-dark.png
          cp artifacts/ui/crayon-lab-banking-desktop-light.png docs/images/crayon-lab-banking-desktop-light.png
          cp artifacts/ui/crayon-lab-deploy-desktop-dark.png docs/images/crayon-lab-deploy-desktop-dark.png
          cp artifacts/ui/crayon-lab-banking-mobile-light.png docs/images/crayon-lab-banking-mobile-light.png
          cp artifacts/ui-matrix/manifest.json docs/images/visual-matrix-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "Verified visual proof unchanged"
          else
            git commit -m "docs: refresh verified CRAYON Lab visual proof [skip ci]"
            git push
          fi
      - name: Mark main verification successful
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"living-crayon","description":"CRAYON main verification, accessibility, and visual proof passed"}'
      - name: Mark main verification failed
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"living-crayon","description":"CRAYON main verification failed"}'
