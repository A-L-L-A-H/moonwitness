services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moonwitness
      POSTGRES_USER: moonwitness
      POSTGRES_PASSWORD: moonwitness
    ports:
      - "5432:5432"
    volumes:
      - moonwitness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonwitness -d moonwitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - moonwitness-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moonwitness-postgres:
  moonwitness-redis:
