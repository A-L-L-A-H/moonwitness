name: Dev promotion readiness

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: Report manual promotion requirement
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Explain promotion policy
        env:
            EVENT_NAME: ${{ github.event_name }}
            CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::notice::Manual run only. Confirm the latest CI on dev before promotion."
            else
              echo "CI passed on dev: $CI_RUN_URL"
            fi
            echo "The repository owner must open, review, and manually merge the dev-to-main promotion PR."
