name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::No release tag resolved for this run."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check deployment credentials
        id: creds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          missing=""
          [ -z "$VPS_HOST" ]        && missing="$missing VPS_HOST(secret)"
          [ -z "$VPS_USER" ]        && missing="$missing VPS_USER(secret)"
          [ -z "$VPS_SSH_KEY" ]     && missing="$missing VPS_SSH_KEY(secret)"
          [ -z "$VPS_DEPLOY_PATH" ] && missing="$missing VPS_DEPLOY_PATH(var)"
          [ -z "$PRODUCTION_URL" ]  && missing="$missing PRODUCTION_URL(var)"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping remote SSH deploy; missing:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Configure SSH key and known_hosts
        if: steps.creds.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf 'Host %s\n  Port %s\n' "$VPS_HOST" "$VPS_PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

      - name: Pre-flight check
        if: steps.creds.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            echo "=== pre-flight: docker ==="
            docker info --format '{{.ServerVersion}}' || { echo "ERROR: docker not running"; exit 1; }
            echo "=== pre-flight: compose file ==="
            test -f "${VPS_DEPLOY_PATH}/docker-compose.yml" || { echo "ERROR: compose file missing at ${VPS_DEPLOY_PATH}/docker-compose.yml"; exit 1; }
            echo "=== pre-flight: validate compose ==="
            docker compose -f "${VPS_DEPLOY_PATH}/docker-compose.yml" config --quiet
            echo "=== pre-flight: disk space ==="
            df -h "${VPS_DEPLOY_PATH}"
            echo "pre-flight passed"
          REMOTE

      - name: Pull release images and deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<REMOTE
            set -euo pipefail
            export MW_RELEASE_TAG="$TAG"
            cd "\${VPS_DEPLOY_PATH}"
            echo "=== deploy: pulling release tag \${MW_RELEASE_TAG} ==="
            git fetch --all --tags --prune
            git checkout "\${MW_RELEASE_TAG}"
            echo "=== deploy: docker compose up ==="
            docker compose pull --quiet
            docker compose up -d --build --remove-orphans
            echo "=== deploy: pruning old images ==="
            docker image prune -f || true
            echo "deploy step complete"
          REMOTE

      - name: Health check (Caddy + API)
        if: steps.creds.outputs.configured == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          echo "=== health check: waiting for services ==="
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/health.txt -w "%{http_code}" \
              --connect-timeout 5 --max-time 10 \
              "${PRODUCTION_URL%/}/api/health" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "health check passed on attempt $attempt"
              cat /tmp/health.txt || true
              break
            fi
            echo "attempt $attempt: HTTP $code (sleeping 10s)"
            sleep 10
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Health check never returned 200 after 20 attempts."
              echo "=== container status ==="
              ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
                "cd '${VPS_DEPLOY_PATH}' && docker compose ps && docker compose logs --tail=50 --no-log-prefix 2>&1 | tail -100" || true
              exit 1
            fi
          done

      - name: Smoke test (public URLs)
        if: steps.creds.outputs.configured == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          check_url() {
            local label="$1"
            local url="$2"
            local expected="${3:-200}"
            code=$(curl -sS -o /tmp/smoke.txt -w "%{http_code}" \
              --connect-timeout 5 --max-time 15 "$url" 2>/dev/null || echo "000")
            if [ "$code" = "$expected" ]; then
              echo "OK $label ($code)"
            else
              echo "::error::Smoke test $label failed: expected HTTP $expected, got $code"
              head -c 500 /tmp/smoke.txt || true
              return 1
            fi
          }
          check_url "root page" "$PRODUCTION_URL"
          check_url "api health" "${PRODUCTION_URL%/}/api/health"
          echo "smoke tests passed"

      - name: Rollback on failure
        if: failure() && steps.creds.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          echo "::warning::Deployment failed. Attempting rollback to previous release."
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE' || true
            set -euo pipefail
            cd "${VPS_DEPLOY_PATH}"
            prev_tag=$(git describe --abbrev=0 --tags HEAD^ 2>/dev/null || git rev-parse --short HEAD^)
            echo "rolling back to $prev_tag"
            git checkout "$prev_tag"
            docker compose up -d --remove-orphans
            echo "rollback to $prev_tag complete"
          REMOTE

      - name: Clean up SSH key
        if: always() && steps.creds.outputs.configured == 'true'
        run: rm -f ~/.ssh/id_ed25519
