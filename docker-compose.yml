services:
  api:
    build:
      context: .
      target: api
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: /data/moonwitness.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3003}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      SEED: ${SEED:-0}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-0}
    volumes:
      - moonwitness-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/v1/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:3002
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3002
    depends_on:
      api:
        condition: service_healthy

  allah:
    build:
      context: .
      target: allah
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3003

volumes:
  moonwitness-data:
