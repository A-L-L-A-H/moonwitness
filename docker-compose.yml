services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - moonwitness-public
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:3002
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3002
    networks:
      - moonwitness-public
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-moonwitness}:${POSTGRES_PASSWORD:-moonwitness}@postgres:5432/${POSTGRES_DB:-moonwitness}}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://moonwitness.biz.id,https://a-l-l-a-h.com,https://id.moonwitness.biz.id}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      RADIUS_URL: http://radius:8090
      SNMP_POLLER_URL: http://snmp-poller:8094
      SYSLOG_URL: http://syslog:8093
      MID_ISSUER_URL: ${MID_ISSUER_URL:-https://id.moonwitness.biz.id}
      MID_KEY_ENCRYPTION_SECRET: ${MID_KEY_ENCRYPTION_SECRET:?MID_KEY_ENCRYPTION_SECRET must be set}
      MID_COOKIE_DOMAIN: ${MID_COOKIE_DOMAIN:-.moonwitness.biz.id}
      SESSION_SECRET: ${SESSION_SECRET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      CONTROL_NATIVE_SETUP: ${CONTROL_NATIVE_SETUP:-1}
      INSTANCE_NAME: ${INSTANCE_NAME:-Moonwitness}
      SEED: ${SEED:-0}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-0}
    volumes:
      - moonwitness-data:/data
    networks:
      - moonwitness-public
      - moonwitness-internal
    depends_on:
      postgres:
        condition: service_healthy
      radius:
        condition: service_healthy
      snmp-poller:
        condition: service_healthy
      syslog:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/v1/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  radius:
    build:
      context: ./services/radius
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      ALLOW_PUBLIC_BIND: "1"
      HTTP_PORT: 8090
      RADIUS_AUTH_PORT: 1812
      RADIUS_ACCT_PORT: 1813
      DATABASE_URL: sqlite:/data/radius.db?mode=rwc
      RADIUS_SECRET: ${RADIUS_SECRET:-}
      RADIUS_NAS_CLIENTS: ${RADIUS_NAS_CLIENTS:-}
    volumes:
      - radius-data:/data
    networks:
      - moonwitness-internal
    ports:
      - "${RADIUS_BIND_IP:-0.0.0.0}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-0.0.0.0}:1813:1813/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  snmp-poller:
    build:
      context: ./services/snmp-poller
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      ALLOW_PUBLIC_BIND: "1"
      HTTP_PORT: 8094
      DATABASE_URL: sqlite:/data/snmp.db?mode=rwc
      SNMP_CREDENTIAL_KEY: ${SNMP_CREDENTIAL_KEY:-}
      SNMP_POLL_INTERVAL: ${SNMP_POLL_INTERVAL:-60}
      SNMP_TIMEOUT_MS: ${SNMP_TIMEOUT_MS:-2000}
    volumes:
      - snmp-data:/data
    networks:
      - moonwitness-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8094/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  syslog:
    build:
      context: ./services/syslog
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      ALLOW_PUBLIC_BIND: "1"
      HTTP_PORT: 8093
      SYSLOG_UDP_PORT: 5140
      SYSLOG_TCP_PORT: 5514
      DATABASE_URL: sqlite:/data/syslog.db?mode=rwc
      SYSLOG_MAX_MESSAGES: ${SYSLOG_MAX_MESSAGES:-100000}
    volumes:
      - syslog-data:/data
    networks:
      - moonwitness-internal
    ports:
      - "${SYSLOG_BIND_IP:-127.0.0.1}:5140:5140/udp"
      - "${SYSLOG_BIND_IP:-127.0.0.1}:5514:5514/tcp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8093/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moonwitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-moonwitness}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - moonwitness-internal
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moonwitness} -d ${POSTGRES_DB:-moonwitness}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  moonwitness-public:
    name: moonwitness-public
    driver: bridge
  moonwitness-internal:
    name: moonwitness-internal
    driver: bridge
    internal: true

volumes:
  moonwitness-data:
    name: moonwitness-data
  postgres-data:
    name: postgres-data
  radius-data:
    name: radius-data
  snmp-data:
    name: snmp-data
  syslog-data:
    name: syslog-data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
