  - file_key: LP5AwOwe6QGeXRNpeZWsjd
    supplied_name: "MoonWitness Design System — Experimental Observatory UI"
    url: "https://www.figma.com/design/LP5AwOwe6QGeXRNpeZWsjd/MoonWitness-Design-System-%E2%80%94-Experimental-Observatory-UI"
