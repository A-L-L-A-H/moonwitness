  - file_key: wTw3wWrtK8Xl6t1LSWWxDI
    supplied_name: "MoonWitness — Where Myth Fade to Legend — Design System"
    url: "https://www.figma.com/design/wTw3wWrtK8Xl6t1LSWWxDI/MoonWitness-%E2%80%94-Where-Myth-Fade-to-Legend-%E2%80%94-Design-System"
    classification: LEGACY_APPLICATION_DESIGN_SYSTEM_REFERENCE
