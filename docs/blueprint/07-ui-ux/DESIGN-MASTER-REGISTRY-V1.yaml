version: 1
status: blueprint_locked_existing_master_audit

master:
  id: MW-UI-MASTER-V1
  display_name: "MoonWitness — Canonical Product UI Master"
  portable_basename: moonwitness-canonical-ui-master
  lifecycle_state: EXISTING_CANDIDATE_DISCOVERED_AUDIT_PENDING
  creation_allowed: false
  new_master_creation_policy: FORBIDDEN_WHILE_EXISTING_CANDIDATE_IS_UNRESOLVED

purpose:
  - single logical design master for MoonWitness product UI
  - prevent duplicate Figma/OpenPencil masters and visual drift
  - preserve one component-first lineage across editors and exports

