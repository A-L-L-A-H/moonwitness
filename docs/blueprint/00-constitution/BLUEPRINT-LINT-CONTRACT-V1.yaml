version: 1
status: locked
purpose: Machine-checkable invariants for blueprint consistency before implementation.
checks:
  - id: unique_capability_owner
    input: 02-domain/CAPABILITY-REGISTRY-V2.yaml
    assertion: every_capability_has_exactly_one_canonical_owner
  - id: unique_contract_owner
    input: 03-contracts/CONTRACT-REGISTRY.yaml
    assertion: every_contract_has_exactly_one_owner
  - id: unique_data_owner
    input: 04-data/DATABASE-OWNERSHIP-MATRIX-V1.yaml
    assertion: every_persistent_store_has_exactly_one_owner
  - id: api_capability_mapping
    input: 06-api/API-OPERATION-CATALOG-V1.yaml
    assertion: every_public_operation_maps_to_exactly_one_capability
  - id: canonical_network_door
    inputs: [00-constitution/ARCHITECTURE-TRUTH-V1.md, 06-api/API-CONTRACT-POLICY-V1.yaml]
    assertion: exactly_one_canonical_network_door
  - id: repository_layer_completeness
    inputs: [16-repositories/repository-manifest.yaml, 16-repositories/DEPENDENCY-DIRECTION.yaml]
    assertion: every_repository_has_exactly_one_layer
  - id: dependency_acyclic
    input: 16-repositories/PACKAGE-DEPENDENCY-GRAPH-V1.yaml
    assertion: dependency_graph_has_no_cycles
  - id: forbidden_edges
    input: 16-repositories/DEPENDENCY-DIRECTION.yaml
    assertion: no_forbidden_dependency_edge_exists
  - id: historical_superseded
    assertion: versioned_nonactive_artifacts_are_marked_superseded
  - id: no_plane
    assertion: no_active_artifact_references_plane_as_platform_dependency
  - id: runtime_policy_consistent
    inputs: [00-constitution/ADR-021-LATEST-RUNTIME-COMPATIBILITY.md, 05-engineering/TOOLCHAIN-MANIFEST-V1.yaml, 13-deployment/SERVERLESS-AND-LATEST-RUNTIME-ARCHITECTURE-V1.md]
    assertion: runtime_policy_is_consistent
  - id: api_contract_consistent
    inputs: [06-api/openapi/openapi.yaml, 06-api/API-OPERATION-CATALOG-V1.yaml, 06-api/API-CONTRACT-POLICY-V1.yaml]
    assertion: openapi_and_operation_catalog_are_consistent
failure_policy:
  blocking: true
  output: machine_readable_violation_report
  implementation_authorized_when: zero_blocking_violations
