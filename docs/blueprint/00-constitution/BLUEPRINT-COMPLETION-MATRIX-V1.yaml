quality_rules:
  - exactly_one_active_artifact_per_decision
  - historical_versions_must_be_marked_superseded
  - worker_prompts_are_execution_artifacts_not_architecture_truth
  - no_repository_is_provisioned_without_governance_baseline
  - no_public_api_is_complete_until_openapi_and_schema_validation_pass
  - design_complete_does_not_equal_implementation_certified
  - no_plane_dependency_or_reference_is_allowed
  - no_unverified_current_runtime_is_allowed_as_production_baseline
  - post_freeze_architecture_change_requires_new_adr
  - canonical_contract_wire_naming_is_camelCase
  - problem_details_retryable_is_required_boolean
  - reusable_private_packages_use_github_packages_npm_registry
release_gate:
  design_freeze: PASS
  architecture_design: PASS
  canonical_machine_contract_design: PASS
  contradiction_scan_design: PASS
  foundation_preflight_authorized: true
  foundation_implementation: IN_PROGRESS
  package_distribution: PENDING
