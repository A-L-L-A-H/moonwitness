version: 1
status: proposed
authority: non-canonical-planning-draft
date: 2026-09-01
program: ROCKSOUL-LAZARUS
title: "ROCKSOUL LAZARUS proposed issue backlog"
companion_plan: 08-ai/ROCKSOUL-LAZARUS-PROGRAM-PLAN-DRAFT-V1.md
research_basis: 08-ai/ROCKSOUL-LAZARUS-PROPHETIC-ETHICS-RESEARCH-V1.md
production_base:
  repository: ArsyBelovedLabs/moonwitness-platform-foundation
  role: application_domain_kernel_and_plugin_runtime
  platform_backbone: GitLab_Self_Hosted
  integration_boundaries: [REST, OIDC, webhooks, Package_Registry, runners, CI_CD]
  status: selected_pending_adr_and_production_evidence
platform_backbone:
  provider: GitLab_Self_Hosted
  role: source_ci_cd_runner_registry_delivery_backbone
  status: live_installation_pending_endpoint_and_environment_contract
architecture_authority: ArsyBelovedLabs/moonwitness-blueprint

publication:
  enabled: false
  reason: "Human review and the GitLab/Foundation production-boundary ADR must precede GitHub issue creation."
  first_target: ArsyBelovedLabs/moonwitness-blueprint
  production_implementation_target: ArsyBelovedLabs/moonwitness-platform-foundation
  duplicate_policy: transfer_or_link_never_duplicate
  implementation_flow: blueprint_to_issue_to_branch_to_draft_pr_to_ci_to_review

rules:
  - "This backlog does not amend the frozen MoonWitness architecture."
  - "A repository-topology, ownership, protocol, persistence, deployment, or public-contract change requires an ADR."
  - "Legacy bjo163 repositories remain read-only implementation evidence."
  - "Unknown states, commands, tools, schemas, and verification gates fail closed."
  - "No issue may authorize reset, clean, deletion, broad staging, production action, or external messaging without a scoped safety contract and approval."
  - "Local development is source-mode by default; production packaging follows a separately approved deployment decision."
  - "Religious source mappings remain attributed research and cannot grant software authority."
  - "Quantum, blockchain, custom-language, AGI, and ASI claims require independent empirical evidence and cannot bypass ordinary gates."

priority_definition:
  P0: blocks trustworthy execution or can cause destructive, deceptive, unauthorized, or unrecoverable behavior
  P1: required for a reliable multi-agent beta or operator pilot
  P2: improves quality, scale, usability, or research value after the safety baseline
  P3: speculative research that must remain outside the production critical path

effort_definition:
  S: up_to_2_engineering_days
  M: 3_to_5_engineering_days
  L: 6_to_10_engineering_days
  XL: requires_decomposition_after_discovery

