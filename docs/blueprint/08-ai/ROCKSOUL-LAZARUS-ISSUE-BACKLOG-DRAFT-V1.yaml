gates:
  - id: G0
    name: governance_truth
    exit: "Approved ownership, repository inventory, lifecycle, protected delivery, and upstream policy."
  - id: G1
    name: contracts_and_safety
    exit: "Versioned cross-service contracts and zero known destructive or false-success paths."
  - id: G2
    name: trustworthy_local_alpha
    exit: "Restartable serial goal flow with evidence and zero false success across the alpha benchmark."
  - id: G3
    name: parallel_beta
    exit: "Leased parallel DAG improves measured outcomes without safety or reproducibility regression."
  - id: G4
    name: operator_experience
    exit: "Authenticated browser, channel, approval, evidence, diff, cancellation, and recovery E2E."
  - id: G5
    name: source_linked_ethics_research
    exit: "Reviewed source lanes, adversarial evaluation, baseline, ablation, failures, and human sign-off."
  - id: G6
    name: production_pilot
    exit: "SLO, security, recovery, release, cost, and observation-period evidence pass."
  - id: G7
    name: experimental_laboratory
    exit: "Classical baseline, reproducibility, independent review, and production-independent fallback."

