    acceptance_criteria:
      - "Architect, security, QA, evidence, and impact reviews have disjoint prompts and recorded model/provider provenance."
      - "Dissent is stored before synthesis and cannot be silently rewritten by the supervisor."
      - "Council use must beat a simpler baseline on predefined tasks or remain optional."
    evidence: [dissent_fixture, council_ablation, provenance_records]

  - id: RSL-ORC-005
    title: "Enforce calibrated cognitive hard gates throughout the lifecycle"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-platform-foundation
      - ArsyBelovedLabs/rocksoul-orchestrator
    gate: G3
    priority: P1
    type: evaluation
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-EVAL-001, RSL-ORC-001]
    acceptance_criteria:
      - "Scoring is evaluated at plan, act, verify, deliver, rollback, and memory-promotion transitions."
      - "Safety, verification, approval, privacy, reversibility, and provenance remain non-compensable hard gates."
      - "Weights and thresholds are calibrated and versioned from benchmark evidence."
    evidence: [calibration_report, lifecycle_gate_tests, score_version_registry]

  - id: RSL-MOD-001
    title: "Implement benchmarked local-first and sanitized cloud model routing"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G3
    priority: P1
    type: feature
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-ORC-001, RSL-EVAL-001]
    acceptance_criteria:
      - "Local, online, and fallback adapters share one provider-neutral task contract."
      - "Routing uses observed quality, privacy, reliability, latency, cost, tool success, and resource evidence."
      - "A provider failure cannot bypass approval or verification."
    evidence: [model_route_benchmark, fallback_tests, provider_provenance]

  - id: RSL-MOD-002
    title: "Add disclosure budgets, sanitization evidence, and private-context controls"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G3
    priority: P1
    type: privacy
    effort: M
    status: proposed_blocked
    blocked_by: [RSL-MOD-001, RSL-SAFE-005]
    acceptance_criteria:
      - "Cloud requests contain the minimum approved context and a redaction/disclosure manifest."
      - "Secrets, raw long-term memory, credentials, and prohibited paths fail closed."
      - "Cumulative disclosure is budgeted per goal and visible to the user."
    evidence: [privacy_fixtures, disclosure_ledger, provider_request_snapshot_tests]

  - id: RSL-MEM-001
    title: "Build an epistemic ledger for claims, sources, confidence, contradiction, and expiry"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G3
    priority: P1
    type: feature
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-CON-001, RSL-ORC-002]
    acceptance_criteria:
      - "Facts, hypotheses, human decisions, source passages, model synthesis, and software assumptions use distinct record types."
      - "Claims retain source URI/hash, observation time, confidence, contradiction, and expiry."
      - "Expired or contradicted claims cannot silently authorize action."
    evidence: [ledger_schema, contradiction_tests, provenance_query_demo]

  - id: RSL-MEM-002
    title: "Govern operational memory and reusable skill promotion"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G3
    priority: P1
    type: safety
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-MEM-001, RSL-EVAL-001]
    acceptance_criteria:
      - "Task memory is ephemeral by default; durable promotion requires evaluation, provenance, scope and human approval."
      - "Prompt injection, poisoned incidents, obsolete guidance, and cross-project leakage are tested."
      - "Skills have version, capability declaration, rollback, revocation, and regression suite."
    evidence: [memory_policy, poisoning_red_team, skill_promotion_record]

  - id: RSL-BRW-001
    title: "Integrate typed browser plans, approval, cancellation, and evidence with orchestrator"
    target_repositories:
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-browser-worker
    gate: G4
    priority: P0
    type: feature
    effort: L
    status: proposed
    blocked_by: [RSL-CON-003, RSL-SAFE-005, RSL-ORC-001]
    acceptance_criteria:
      - "Planner output compiles into validated browser steps rather than free-form browser instructions."
      - "approval_required pauses the goal until an action-digest decision is resolved or expires."
      - "Cancellation reaches active Playwright work and terminal evidence is reconciled."
    evidence: [browser_contract_e2e, approval_resume_test, cancellation_test]

  - id: RSL-BRW-002
    title: "Harden browser network, artifact, credential, and prompt-injection boundaries"
    target_repositories: [ArsyBelovedLabs/rocksoul-browser-worker]
    gate: G4
    priority: P0
    type: security
    effort: L
    status: proposed
    blocked_by: [RSL-SAFE-005]
    acceptance_criteria:
      - "DNS rebinding, redirects, private-network targets, downloads, popups, new tabs, and credential entry are governed."
      - "Screenshots, DOM extracts, logs, and downloads have access control, hashes, retention, and redaction."
      - "Page content cannot redefine tool policy or approval requirements."
    evidence: [browser_threat_model, ssrf_suite, artifact_access_tests, injection_red_team]

  - id: RSL-GTW-001
    title: "Complete authenticated Telegram and Slack ingress adapters"
    target_repositories: [ArsyBelovedLabs/rocksoul-gateway]
    gate: G4
    priority: P1
    type: feature
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-CON-001, RSL-SAFE-005, RSL-ORC-001]
    acceptance_criteria:
      - "Vendor-native signature, timestamp, replay, identity, allowlist and idempotency checks pass before normalization."
      - "Commands map to explicit goal, approval, cancellation and status operations."
      - "Untrusted channel text cannot choose workspace, capability, model authority, or approval identity."
    evidence: [vendor_signature_fixtures, replay_tests, channel_e2e]

  - id: RSL-GTW-002
    title: "Add policy-controlled outbound notifications and schedules"
    target_repositories: [ArsyBelovedLabs/rocksoul-gateway]
    gate: G4
    priority: P1
    type: feature
    effort: M
    status: proposed_blocked
    blocked_by: [RSL-GTW-001]
    acceptance_criteria:
      - "Outbound destination, content class, approval, retry, idempotency and delivery receipt are recorded."
      - "Consequential, public, sensitive, or high-volume messages require policy and human approval."
      - "Schedules use timezone, missed-run, expiry, concurrency and cancellation semantics."
    evidence: [outbound_policy_tests, schedule_restart_tests, delivery_receipts]

  - id: RSL-WEB-001
    title: "Build the operator control plane for approvals, evidence, diffs, cost, and recovery"
    target_repositories: [ArsyBelovedLabs/rocksoul-code-web]
    gate: G4
    priority: P1
    type: feature
    effort: XL
    status: proposed_blocked
    blocked_by: [RSL-ORC-001, RSL-CON-001, RSL-SAFE-005]
    acceptance_criteria:
      - "UI shows goal/task state, owner, model route, authority, approvals, commands, browser actions, evidence, changed files, cost and blockers."
      - "Approval displays exact action digest, consequence, scope, expiry and recourse."
      - "Cancel, retry, resume, rollback preview, draft delivery and incident views are accessible and state-consistent."
    evidence: [accessibility_audit, golden_flow_screens, contract_e2e]

  - id: RSL-WEB-002
    title: "Certify full source-mode browser-to-engine-to-evidence flows"
    target_repositories:
      - ArsyBelovedLabs/rocksoul-code-web
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-runner
      - ArsyBelovedLabs/rocksoul-browser-worker
      - ArsyBelovedLabs/rocksoul-gateway
      - ArsyBelovedLabs/rocksoul-code
    gate: G4
    priority: P0
    type: testing
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-WEB-001, RSL-BRW-001, RSL-SAFE-004]
    acceptance_criteria:
      - "E2E covers create, inspect, plan, approve, execute, verify, deny, cancel, restart, recover, diff and draft PR."
      - "Failure injection covers engine, provider, runner, browser, gateway, persistence and network interruption."
      - "Test artifacts prove no unrelated workspace mutation and no false completion."
    evidence: [playwright_report, service_logs, evidence_bundle, workspace_hash_comparison]

  - id: RSL-EVAL-001
    title: "Create the ROCKSOUL autonomy benchmark and false-success metric"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G2
    priority: P0
    type: evaluation
    effort: L
    status: proposed
    blocked_by: [RSL-CON-001]
    acceptance_criteria:
      - "Versioned tasks cover coding, review, repair, browser, operations, refusal, ambiguity, privacy and recovery."
      - "Metrics include task success, false success, intervention, rollback, safety refusal, cost, latency, disclosure and reproducibility."
      - "Baseline uses the simplest viable serial agent before adding council, memory or quantum components."
    evidence: [benchmark_manifest, baseline_results, scoring_protocol]

  - id: RSL-EVAL-002
    title: "Run adversarial red-team and failure-injection certification"
    target_repositories:
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-runner
      - ArsyBelovedLabs/rocksoul-browser-worker
      - ArsyBelovedLabs/rocksoul-gateway
      - ArsyBelovedLabs/rocksoul-code-web
    gate: G4
    priority: P0
    type: security
    effort: XL
    status: proposed_blocked
    blocked_by: [RSL-EVAL-001, RSL-SAFE-005, RSL-WEB-002]
    acceptance_criteria:
      - "Fixtures cover prompt injection, tool-output injection, poisoned memory, stale approval, replay, path escape, secret leakage, false evidence, correlated reviewers and dependency compromise."
      - "Every failure has expected detect, deny, contain, recover and audit outcomes."
      - "Blocking failures remain open and prevent pilot promotion."
    evidence: [threat_fixture_pack, red_team_report, remediation_trace]

  - id: RSL-EVAL-003
    title: "Replace autonomy marketing levels with evidence-backed maturity claims"
    target_repositories:
      - ArsyBelovedLabs/rocksoul-code-web
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-cli
    gate: G2
    priority: P1
    type: governance
    effort: S
    status: proposed
    blocked_by: [RSL-EVAL-001]
    acceptance_criteria:
      - "R0-R5 labels map to explicit capabilities, constraints, benchmark and certification evidence."
      - "UI and docs do not imply AGI, ASI, consciousness, infallibility, prophecy, unrestricted autonomy, or production certification."
      - "Unsupported levels are hidden or visibly marked research-only."
    evidence: [claim_inventory, documentation_tests, benchmark_links]

  - id: RSL-PEP-001
    title: "Conduct qualified human review of prophetic ethics source lanes and mappings"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-blueprint
      - ArsyBelovedLabs/moonwitness-prophetic
    gate: G5
    priority: P1
    type: research
    effort: XL
    status: proposed_needs_human_review
    blocked_by: []
    acceptance_criteria:
      - "Reviewers inspect passage identity, Arabic text where used, translation, attribution, interpretation boundary, disagreement and prohibited claims."
      - "Qur'an, Tawrat, Zabur, Injil, textual witnesses, tafsir, scholarship and model synthesis remain distinct provenance lanes."
      - "Corrections preserve a versioned review trail."
    evidence: [reviewer_protocol, signed_review_records, source_change_log]

  - id: RSL-PEP-002
    title: "Evaluate PEP advice against neutral and simpler safety baselines"
    target_repositories: [ArsyBelovedLabs/moonwitness-prophetic]
    gate: G5
    priority: P1
    type: evaluation
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-PEP-001, RSL-EVAL-001]
    acceptance_criteria:
      - "Baseline, PEP-assisted, and ablated variants run the same adversarial tasks."
      - "Metrics cover attribution accuracy, uncertainty, harm, proportionality, appeal, non-impersonation and false authority."
      - "Negative results and regressions are published with equal status."
    evidence: [pep_benchmark, ablation_report, reviewer_signoff]

  - id: RSL-PEP-003
    title: "Add non-impersonation, attribution, and hidden-wisdom firewall tests"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-prophetic
      - ArsyBelovedLabs/rocksoul-code-web
    gate: G5
    priority: P0
    type: safety
    effort: M
    status: proposed_blocked
    blocked_by: [RSL-PEP-001]
    acceptance_criteria:
      - "The system refuses first-person prophetic identity, revelation, miracle, unseen-knowledge, resurrection, salvation, and digital-return claims."
      - "UI distinguishes direct source, translation, attributed interpretation, and model synthesis."
      - "Hidden-wisdom language cannot authorize secrecy, harm, surveillance, bypass, or irreversible action."
    evidence: [adversarial_fixture_pack, ui_source_lane_test, refusal_regression]

  - id: RSL-OPS-001
    title: "Create a reliable source-mode supervisor for local development"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-platform-foundation
      - ArsyBelovedLabs/rocksoul-code-web
    gate: G2
    priority: P0
    type: operations
    effort: M
    status: proposed
    blocked_by: [RSL-GOV-003, RSL-SAFE-005]
    acceptance_criteria:
      - "One documented command starts engine, web, orchestrator, runner, browser, and gateway from sibling source repositories."
      - "Ports, PID ownership, logs, readiness, restart, graceful stop, stale-process cleanup and failure reporting are deterministic."
      - "The launcher does not require Docker CLI for local use."
    evidence: [windows_source_smoke, clean_stop_test, port_collision_test]

  - id: RSL-OPS-002
    title: "Add cross-service observability, SLOs, audit retention, and resource accounting"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-platform-foundation
      - ArsyBelovedLabs/rocksoul-code-web
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-runner
      - ArsyBelovedLabs/rocksoul-browser-worker
      - ArsyBelovedLabs/rocksoul-gateway
      - ArsyBelovedLabs/rocksoul-code
    gate: G6
    priority: P1
    type: observability
    effort: XL
    status: proposed_blocked
    blocked_by: [RSL-WEB-002]
    acceptance_criteria:
      - "Goal, task, model, tool, command, browser, approval and delivery share trace/correlation identity."
      - "SLIs cover success, false success, queue, latency, cancellation, recovery, cost, tokens, storage and evidence completeness."
      - "Sensitive data retention and access are explicit and tested."
    evidence: [trace_demo, slo_catalog, retention_test, resource_report]

  - id: RSL-OPS-003
    title: "Establish reproducible releases, SBOM, dependency review, backup, restore, and pilot gate"
    target_repositories:
      - ArsyBelovedLabs/moonwitness-platform-foundation
      - ArsyBelovedLabs/rocksoul-code
      - ArsyBelovedLabs/rocksoul-code-web
      - ArsyBelovedLabs/rocksoul-orchestrator
      - ArsyBelovedLabs/rocksoul-runner
      - ArsyBelovedLabs/rocksoul-browser-worker
      - ArsyBelovedLabs/rocksoul-gateway
    gate: G6
    priority: P1
    type: operations
    effort: XL
    status: proposed_blocked
    blocked_by: [RSL-GOV-004, RSL-OPS-002, RSL-EVAL-002]
    acceptance_criteria:
      - "Pinned toolchains, lockfiles, provenance, SBOM, vulnerability checks and signed release records exist."
      - "State and evidence backup/restore plus deployment rollback are rehearsed."
      - "Pilot promotion requires passing SLO, security, recovery, benchmark and observation-period evidence."
    evidence: [release_manifest, sbom, restore_rehearsal, pilot_decision_record]

  - id: RSL-LAB-001
    title: "Prototype a declarative MITHAQ policy notation with standard-format fallback"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G7
    priority: P3
    type: research
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-CON-001, RSL-EVAL-001, RSL-ORC-001]
    acceptance_criteria:
      - "Notation compiles deterministically to versioned JSON Schema-compatible policy data."
      - "Parser, formatter, type checker, source map, diagnostics, capability analysis and denial semantics are tested."
      - "Names are mnemonic engineering vocabulary, not claims of a Qur'an-authored programming language."
    evidence: [grammar, compiler_tests, json_round_trip, usability_ablation]

  - id: RSL-LAB-002
    title: "Build content-addressed witness records before evaluating decentralized anchors"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G7
    priority: P2
    type: research
    effort: L
    status: proposed_blocked
    blocked_by: [RSL-MEM-001, RSL-OPS-002]
    acceptance_criteria:
      - "Evidence manifests use canonical encoding, hashes, signatures, timestamps, lineage, access control and retention."
      - "Tamper detection and recovery work without a blockchain dependency."
      - "Any external or decentralized anchor is adopted only after threat, privacy, cost and recovery comparison."
    evidence: [witness_schema, tamper_fixture, classical_storage_baseline, anchor_decision]

  - id: RSL-LAB-003
    title: "Create a classical-first quantum experiment harness"
    target_repositories: [ArsyBelovedLabs/rocksoul-orchestrator]
    gate: G7
    priority: P3
    type: research
    effort: XL
    status: proposed_blocked
    blocked_by: [RSL-EVAL-001, RSL-ORC-003, RSL-OPS-002]
    acceptance_criteria:
      - "Every PennyLane or later backend experiment includes tuned classical baseline, seeds, encoding, backend, shots, depth, noise, queue, runtime, cost and fallback."
      - "Promotion requires reproducible task-relevant improvement and independent review."
      - "Negative, dequantized, or non-advantage results are preserved and production remains quantum-independent."
    evidence: [experiment_manifest, classical_baseline, repeated_runs, independent_review]

