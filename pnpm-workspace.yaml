packages:
  - "apps/*"
  - "packages/*"
  - "packages/addons/*"

# Security floors for vulnerable transitive dependencies.
overrides:
  postcss: "^8.5.23"
  esbuild: "^0.28.1"
  minimatch: "^11.0.1"

allowBuilds:
  "@swc/core": true
  "@tailwindcss/oxide": true
  bcrypt: true
  esbuild: true
  sharp: true
  workerd@1.20250718.0: true
  workerd@1.20261103.1: true
  workerd@1.20261110.1: true
