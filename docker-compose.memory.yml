services:
  memory:
    build:
      context: ./services/memory/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      MID_ISSUER_URL: ${MID_ISSUER_URL:-https://id.moonwitness.biz.id}
      MID_AUDIENCE: ${MEMORY_MID_AUDIENCE:-moonwitness-memory}
      MEMORY_REQUIRE_AUTH: ${MEMORY_REQUIRE_AUTH:-true}
      MOONWITNESS_SYNC_URL: http://api:3002
      S3_ENDPOINT_URL: ${MEMORY_S3_ENDPOINT_URL:-http://storage:8091}
      S3_BUCKET: ${MEMORY_S3_BUCKET:-mw-memory}
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-local-memory-access}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-replace-this-long-random-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://moonwitness.biz.id,https://a-l-l-a-h.com}
    volumes:
      - memory-data:/data
    networks:
      - moonwitness-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  memory-data:
    name: memory-data
